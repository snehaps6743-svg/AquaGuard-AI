name: AquaGuard AI Automatic Monitoring

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-water-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrieve Official Lake Biwa Data
        run: python fetch_official_data.py

      - name: Run AI Anomaly Detection
        run: python online_anomaly_detection.py

      - name: Save Updated Results to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lake_biwa_official_online.csv
          git add outputs/official_online_anomaly_results.csv
          if ! git diff --cached --quiet; then
            git commit -m "Automatically update Lake Biwa monitoring results"
            git push
          else
            echo "No new changes to save."
          fi